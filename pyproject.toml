[project]
name = "bems-rag"
version = "0.1.0"
description = "Production RAG for building energy management, with full MLOps scaffolding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sotirios Konstantakos" }]

dependencies = [
    "rank-bm25>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "mlflow>=2.12",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
orchestration = ["dagster>=1.7", "dagster-webserver>=1.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast code-correctness tests",
    "data: data schema / range / null checks",
    "integration: end-to-end pipeline and serving tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
