name: CD

# Runs after CI passes on main: evaluate the challenger, gate it, and (on pass)
# promote. This is the automated shadow -> gate -> promote path; a real deploy would
# add canary traffic and an environment, but the decision logic runs here.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  promote:
    # only run if the CI run actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download BDG2 metadata
        run: |
          mkdir -p data/bdg2
          curl -sL "https://media.githubusercontent.com/media/buds-lab/building-data-genome-project-2/master/data/metadata/metadata.csv" -o data/bdg2/metadata.csv

      - name: Evaluate + gate + promote (challenger vs champion)
        run: python scripts/cd_promote.py

      - name: Upload eval report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: docs/eval_report.md
