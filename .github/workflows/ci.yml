name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download BDG2 metadata (real dataset)
        run: |
          mkdir -p data/bdg2
          curl -sL "https://media.githubusercontent.com/media/buds-lab/building-data-genome-project-2/master/data/metadata/metadata.csv" -o data/bdg2/metadata.csv

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit tests
        run: pytest -m unit -v

      - name: Data tests
        run: pytest -m data -v

      - name: Integration tests
        run: pytest -m integration -v

      - name: Full suite with coverage
        run: pytest --cov=bems_rag --cov-report=term-missing

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: bems-rag-mlops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          docker run -d --name bems -p 8000:8000 bems-rag-mlops:ci
          # wait for the app to come up
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "health OK"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          # a real answer request must return 200 (guards the entrypoint bug)
          code=$(curl -s -o /tmp/ans.json -w "%{http_code}" -X POST \
            http://localhost:8000/answer \
            -H "Content-Type: application/json" \
            -d '{"building_id": "Panther_lodging_Dean", "text": "what is the floor area?"}')
          echo "POST /answer -> $code"
          cat /tmp/ans.json
          test "$code" = "200"
          docker rm -f bems
