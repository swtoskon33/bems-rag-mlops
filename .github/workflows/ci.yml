name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download BDG2 metadata (real dataset)
        run: |
          mkdir -p data/bdg2
          curl -sL "https://media.githubusercontent.com/media/buds-lab/building-data-genome-project-2/master/data/metadata/metadata.csv" -o data/bdg2/metadata.csv

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit tests
        run: pytest -m unit -v

      - name: Data tests
        run: pytest -m data -v

      - name: Integration tests
        run: pytest -m integration -v

      - name: Full suite with coverage
        run: pytest --cov=bems_rag --cov-report=term-missing

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: bems-rag-mlops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
