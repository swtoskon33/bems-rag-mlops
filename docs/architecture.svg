<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica,Arial,sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#14213d">bems-rag-mlops — architecture</text>

  <!-- ===== RAG request path ===== -->
  <text x="30" y="78" font-size="13" font-weight="bold" fill="#0563C1">RAG request path</text>
  <rect x="30" y="90" width="150" height="56" rx="6" fill="#eef2f7" stroke="#0563C1"/>
  <text x="105" y="114" text-anchor="middle" font-size="12" fill="#14213d">Operator query</text>
  <text x="105" y="132" text-anchor="middle" font-size="10" fill="#555">building_id + question</text>

  <rect x="205" y="90" width="150" height="56" rx="6" fill="#eef2f7" stroke="#0563C1"/>
  <text x="280" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Retrieve</text>
  <text x="280" y="130" text-anchor="middle" font-size="10" fill="#555">per-tenant FAISS</text>

  <rect x="380" y="90" width="150" height="56" rx="6" fill="#eef2f7" stroke="#0563C1"/>
  <text x="455" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Generate</text>
  <text x="455" y="130" text-anchor="middle" font-size="10" fill="#555">template / OpenAI</text>

  <rect x="555" y="90" width="150" height="56" rx="6" fill="#eef2f7" stroke="#0563C1"/>
  <text x="630" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Groundedness</text>
  <text x="630" y="130" text-anchor="middle" font-size="10" fill="#555">numeric + semantic</text>

  <rect x="730" y="90" width="140" height="56" rx="6" fill="#dfeee5" stroke="#1a7a4c"/>
  <text x="800" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Answer</text>
  <text x="800" y="132" text-anchor="middle" font-size="10" fill="#555">grounded=T/F</text>

  <!-- arrows row 1 -->
  <g stroke="#0563C1" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="180" y1="118" x2="203" y2="118"/>
    <line x1="355" y1="118" x2="378" y2="118"/>
    <line x1="530" y1="118" x2="553" y2="118"/>
    <line x1="705" y1="118" x2="728" y2="118"/>
  </g>

  <!-- ===== Data / index ===== -->
  <text x="30" y="196" font-size="13" font-weight="bold" fill="#0563C1">Data</text>
  <rect x="30" y="208" width="150" height="52" rx="6" fill="#fff5e6" stroke="#c98a00"/>
  <text x="105" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">BDG2 ingest</text>
  <text x="105" y="247" text-anchor="middle" font-size="10" fill="#555">1,636 real buildings</text>
  <line x1="105" y1="208" x2="105" y2="150" stroke="#c98a00" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <text x="118" y="180" font-size="9" fill="#555">index per tenant</text>

  <!-- ===== MLOps scaffolding band ===== -->
  <rect x="30" y="300" width="840" height="180" rx="8" fill="#f7f9fc" stroke="#c9d3e0"/>
  <text x="45" y="322" font-size="13" font-weight="bold" fill="#14213d">MLOps scaffolding</text>

  <!-- eval -->
  <rect x="45" y="336" width="185" height="60" rx="6" fill="#ffffff" stroke="#0563C1"/>
  <text x="137" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Eval harness</text>
  <text x="137" y="376" text-anchor="middle" font-size="10" fill="#555">hit@k · MRR · groundedness</text>
  <text x="137" y="390" text-anchor="middle" font-size="10" fill="#555">25 real-building queries</text>

  <!-- gate -->
  <rect x="245" y="336" width="185" height="60" rx="6" fill="#ffffff" stroke="#0563C1"/>
  <text x="337" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Validation gate</text>
  <text x="337" y="376" text-anchor="middle" font-size="10" fill="#555">champion vs challenger</text>
  <text x="337" y="390" text-anchor="middle" font-size="10" fill="#555">no per-building regression</text>

  <!-- registry -->
  <rect x="445" y="336" width="185" height="60" rx="6" fill="#ffffff" stroke="#0563C1"/>
  <text x="537" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">MLflow registry</text>
  <text x="537" y="376" text-anchor="middle" font-size="10" fill="#555">versions + aliases</text>
  <text x="537" y="390" text-anchor="middle" font-size="10" fill="#555">promote / rollback</text>

  <!-- serving -->
  <rect x="645" y="336" width="210" height="60" rx="6" fill="#ffffff" stroke="#0563C1"/>
  <text x="750" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Serving</text>
  <text x="750" y="376" text-anchor="middle" font-size="10" fill="#555">FastAPI · shadow / canary</text>
  <text x="750" y="390" text-anchor="middle" font-size="10" fill="#555">deterministic routing</text>

  <!-- drift -->
  <rect x="45" y="410" width="185" height="56" rx="6" fill="#ffffff" stroke="#1a7a4c"/>
  <text x="137" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Drift</text>
  <text x="137" y="450" text-anchor="middle" font-size="10" fill="#555">PSI + embedding centroid</text>

  <!-- monitoring -->
  <rect x="245" y="410" width="185" height="56" rx="6" fill="#ffffff" stroke="#1a7a4c"/>
  <text x="337" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Monitoring</text>
  <text x="337" y="450" text-anchor="middle" font-size="10" fill="#555">Prometheus /metrics</text>

  <!-- CI/CD -->
  <rect x="445" y="410" width="185" height="56" rx="6" fill="#ffffff" stroke="#1a7a4c"/>
  <text x="537" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">CI / CD</text>
  <text x="537" y="450" text-anchor="middle" font-size="10" fill="#555">tests · eval→gate→promote</text>

  <!-- docker -->
  <rect x="645" y="410" width="210" height="56" rx="6" fill="#ffffff" stroke="#1a7a4c"/>
  <text x="750" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#14213d">Docker</text>
  <text x="750" y="450" text-anchor="middle" font-size="10" fill="#555">one image: train / eval / serve</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0563C1"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c98a00"/>
    </marker>
  </defs>
</svg>
